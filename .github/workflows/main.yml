name: verify-agent

on:
workflow_dispatch:

jobs:
verify:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v3

  - name: Setup Node
    uses: actions/setup-node@v3
    with:
      node-version: 20

  - name: Install ClawHub
    run: npx clawhub@latest install verified-agent-identity

  - name: Install dependencies
    run: |
      cd scripts
      npm install

  - name: Create Ethereum Identity
    run: node scripts/createNewEthereumIdentity.js

  - name: Link Human to Agent
    run: node scripts/manualLinkHumanToAgent.js --challenge "{\"name\":\"dansleonardo15\",\"description\":\"dansleonardo15 AI Agent\"}"
